name: Auto-Close PRs Over Limit

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  enforce-limit:
    runs-on: ubuntu-latest
    steps:
      - name: Get author's open PRs
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
        run: |
          DATA=$(gh pr list --repo "$REPO" --author "$AUTHOR" --state open --json number,title | jq --argjson current "$CURRENT_PR" '
            map(select(.number != $current)) |
            {
              count: length,
              list: map("- #\(.number): \(.title)") | join("\n")
            }
          ')
          COUNT=$(echo "$DATA" | jq -r '.count')
          LIST=$(echo "$DATA" | jq -r '.list')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Close PR if over limit
        if: steps.prs.outputs.count >= 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          COUNT: ${{ steps.prs.outputs.count }}
          LIST: ${{ steps.prs.outputs.list }}
        run: |
          COMMENT=$(cat << EOF
          Hi @$AUTHOR 👋

          You currently have **$COUNT other open PRs**, but our policy allows a maximum of **3** open PRs at a time.

          Your other currently open PRs:
          $LIST

          This PR has been automatically closed. Please close or wait to merge some of your existing PRs first, then feel free to re-open or submit a new one.

          ---
          *Automated by PR Limit Enforcer*
          EOF
          )

          gh pr close "$PR_NUMBER" --repo "$REPO" --comment "$COMMENT"
