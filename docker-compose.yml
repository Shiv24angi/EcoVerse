services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecoverse-web:latest
    container_name: ecoverse-web-prod
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/carbontracker}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: ecoverse-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mongo_data: