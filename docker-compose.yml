services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecoverse-web:latest
    container_name: ecoverse-web-prod
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: ecoverse-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: